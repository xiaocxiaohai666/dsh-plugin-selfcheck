# dsh-plugin-selfcheck bundle patch: inserts the self-check plugin row into a
# dsh profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
#   dsh plugin --profile web add link:D:/DeepSeekHar/dsh-plugin-selfcheck
#
# The plugin contributes no HTTP route and no client half. At mount it waits for
# the loader tree to settle and then prints every row to the console, followed by
# five install-level checks -- among them deps.peer-gate, which names the plugins
# dsh refuses to mount and which therefore appear in no row at all. One
# model-facing tool (selfcheck_status) returns the same report on demand.
- insert:
    - id: selfcheck
      name: 'dsh-plugin-selfcheck'
